<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1e293b;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-bottom: 30px; 
        }
        
        .header { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border-color); 
        }
        
        .nav { 
            display: flex; 
            gap: 4px; 
            background: var(--card-bg); 
            padding: 4px; 
            border-radius: 12px; 
        }

        .tab { 
            flex: 1; 
            padding: 10px 4px; 
            border: none; 
            background: transparent; 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 11px; 
            cursor: pointer; 
            border-radius: 8px;
            text-align: center;
        }

        .tab.active { 
            background: var(--accent-blue); 
            color: #fff; 
        }
        
        .section { 
            display: none; 
            flex-direction: column; 
            gap: 10px; 
        }

        .section.active { 
            display: flex; 
        }
        
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 14px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        .card:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .quiz-box { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 16px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .option-btn { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 10px; 
            color: #fff; 
            width: 100%; 
            cursor: pointer; 
            text-align: left; 
            font-size: 14px; 
            position: relative;
            z-index: 10;
        }

        .option-btn:active {
            background: rgba(255,255,255,0.15);
        }

        .option-btn.correct { background: var(--green) !important; border-color: var(--green); }
        .option-btn.wrong { background: var(--red) !important; border-color: var(--red); }

        .back-btn { 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            align-self: flex-start;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 id="userName">O'yinchi</h3>
        <div id="totalScore" style="color:var(--gold); font-weight:bold;">0 pt</div>
    </div>

    <!-- NAVIGATSIYA TUGMALARI -->
    <div class="nav">
        <button type="button" class="tab active" onclick="switchTab('arena', this)">🎮 Arena</button>
        <button type="button" class="tab" onclick="switchTab('games', this)">🎯 O'yinlar</button>
        <button type="button" class="tab" onclick="switchTab('leaderboard', this)">🏆 Reyting</button>
        <button type="button" class="tab" onclick="switchTab('tasks', this)">🎁 Bonus</button>
    </div>

    <!-- 1. ARENA BO'LIMI -->
    <div id="arena" class="section active">
        <div class="card" onclick="openQuiz('Matematika')">
            <span>🧮 Matematika Testi</span>
            <span style="color:var(--accent-blue);">Boshlash ➡️</span>
        </div>
        <div class="card" onclick="openQuiz('IT & Dasturlash')">
            <span>💻 IT & Dasturlash</span>
            <span style="color:var(--accent-blue);">Boshlash ➡️</span>
        </div>
    </div>

    <!-- 2. O'YINLAR BO'LIMI -->
    <div id="games" class="section">
        <div class="card" onclick="playSpin()">
            <span>🎡 Omad Charxpalagi</span>
            <span style="color:var(--gold);">Aylantirish</span>
        </div>
    </div>

    <!-- 3. REYTING BO'LIMI -->
    <div id="leaderboard" class="section">
        <div class="card">
            <span id="rankUser">1. Siz</span>
            <span id="rankScore" style="color:var(--gold);">0 pt</span>
        </div>
    </div>

    <!-- 4. BONUS BO'LIMI -->
    <div id="tasks" class="section">
        <div class="card" onclick="getDailyBonus()">
            <span>📅 Kunlik Bonus</span>
            <span style="color:var(--green);">+50 pt</span>
        </div>
    </div>

    <!-- O'YIN OYNASI (TEST) -->
    <div id="quiz-view" class="section">
        <button type="button" class="back-btn" onclick="switchTab('arena')">⬅️ Orqaga</button>
        <div class="quiz-box">
            <h3 id="quizTitle" style="color:var(--accent-blue);">Test</h3>
            <div id="questionText" style="font-weight:bold; margin: 10px 0;">Savol yuklanmoqda...</div>
            <div id="answersContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>
</div>

<script>
    // Telegram xatolarini ushlash uchun xavfsiz ishga tushirish
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    } catch (e) {
        console.log("Telegram SDK xatosi:", e);
    }

    let userScore = parseInt(localStorage.getItem('userScore') || '0');
    document.getElementById('totalScore').innerText = userScore + ' pt';

    function updateScore(pts) {
        userScore += pts;
        localStorage.setItem('userScore', userScore);
        document.getElementById('totalScore').innerText = userScore + ' pt';
        document.getElementById('rankScore').innerText = userScore + ' pt';
    }

    // Tablarni almashtirish funksiyasi (Kafolatlangan)
    function switchTab(tabId, btnElement) {
        // Barcha seksiyalarni berkitish
        const sections = document.querySelectorAll('.section');
        sections.forEach(sec => sec.classList.remove('active'));

        // Tanlangan seksiyani ochish
        const targetSection = document.getElementById(tabId);
        if (targetSection) {
            targetSection.classList.add('active');
        }

        // Tab tugmalarining dizaynini yangilash
        if (btnElement) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            btnElement.classList.add('active');
        }
    }

    // Test funksiyasi
    function openQuiz(category) {
        switchTab('quiz-view');
        document.getElementById('quizTitle').innerText = category + " Testi";
        document.getElementById('questionText').innerText = "1-Savol: 12 + 15 nechiga teng?";
        
        const container = document.getElementById('answersContainer');
        container.innerHTML = `
            <button type="button" class="option-btn" onclick="handleAnswer(true, this)">27</button>
            <button type="button" class="option-btn" onclick="handleAnswer(false, this)">25</button>
            <button type="button" class="option-btn" onclick="handleAnswer(false, this)">30</button>
        `;
    }

    function handleAnswer(isCorrect, btn) {
        if (isCorrect) {
            btn.classList.add('correct');
            updateScore(10);
            alert("To'g'ri! +10 ball");
        } else {
            btn.classList.add('wrong');
            alert("Noto'g'ri!");
        }
        setTimeout(() => switchTab('arena'), 500);
    }

    function playSpin() {
        const reward = 50;
        updateScore(reward);
        alert("🎉 Tabriklaymiz! Omad charxpalagidan " + reward + " ball yutdingiz!");
    }

    function getDailyBonus() {
        updateScore(50);
        alert("🎁 +50 ball bonus berildi!");
    }
</script>

</body>
            </html>
