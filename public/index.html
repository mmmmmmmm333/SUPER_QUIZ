<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #0b0f19; 
            color: #ffffff; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .app { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .header { 
            background: #151c2c; 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid #1e293b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .user-name {
            font-weight: bold;
            font-size: 15px;
        }
        .hearts {
            color: #ef4444;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .score { 
            color: #f59e0b; 
            font-weight: bold;
            font-size: 16px; 
        }
        
        /* TAB TIZIMI */
        .tabs {
            display: flex;
            background: #151c2c;
            border-radius: 12px;
            padding: 4px;
            border: 1px solid #1e293b;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-weight: bold;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .view-section.active {
            display: flex;
        }

        /* CARD VA SAVOLLAR */
        .card { 
            background: #151c2c; 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .q-counter {
            font-size: 12px;
            color: #3b82f6;
            font-weight: bold;
        }
        .question { 
            font-size: 16px; 
            font-weight: bold; 
            color: #f3f4f6; 
            line-height: 1.4;
        }
        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #3b82f6; 
            color: white; 
            padding: 14px; 
            width: 100%; 
            border-radius: 10px; 
            font-size: 14px; 
            cursor: pointer; 
            text-align: left;
        }
        .btn:active { 
            background: #3b82f6; 
        }

        /* REYTING JADVALI */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid #1e293b;
        }
        .rank {
            font-weight: bold;
            width: 30px;
            color: #f59e0b;
        }
        .leader-name {
            flex: 1;
            font-size: 14px;
        }
        .leader-score {
            font-weight: bold;
            color: #10b981;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="user-info">
            <span class="user-name" id="userName">O'yinchi</span>
            <span class="hearts" id="heartsDisplay">❤️❤️❤️❤️❤️</span>
        </div>
        <span class="score" id="userScore">0 pt</span>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('game')">🎮 O'yin</button>
        <button class="tab-btn" onclick="switchTab('leaderboard')">🏆 Top 10</button>
    </div>

    <!-- GAME SECTION -->
    <div id="gameSection" class="view-section active">
        <div class="card" id="quizCard">
            <div class="q-counter" id="qCat">SMART ARENA TEST</div>
            <div class="question" id="qText">Savol yuklanmoqda...</div>
            <div id="answers" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
        
        <!-- ENERGIYA TUGAGANDA CHIQUVCHI BLOK -->
        <div class="card" id="gameOverCard" style="display: none; text-align: center;">
            <h3 style="color: #ef4444; font-size: 20px;">💔 Yurakchalar tugadi!</h3>
            <p style="font-size: 13px; color: #9ca3af; margin: 10px 0;">Yangi imkoniyat olish uchun biroz kutishingiz yoki qayta boshlashingiz mumkin.</p>
            <button class="btn" style="text-align: center; background: #10b981;" onclick="resetHearts()">🔄 Yurakchalarni tiklash</button>
        </div>
    </div>

    <!-- LEADERBOARD SECTION -->
    <div id="leaderboardSection" class="view-section">
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 5px;">🏆 Eng Kuchli O'yinchilar</h3>
            <div id="leaderboardList" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- JavaScript orqali to'ldiriladi -->
            </div>
        </div>
    </div>
</div>

<script>
    const rawQuestions = [
        { q: "15 x 4 nechiga teng?", opts: ["60", "50", "65", "55"], correct: 0, cat: "🧮 Matematika" },
        { q: "25 ning kvadrat ildizi nechaga teng?", opts: ["5", "6", "4", "10"], correct: 0, cat: "🧮 Matematika" },
        { q: "Pythonda konsolga matn chiqarish kodi qaysi?", opts: ["print()", "echo()", "console.log()", "System.out()"], correct: 0, cat: "💻 Dasturlash" },
        { q: "Veb-sahifa tuzilishini (skeletini) yarativchi til?", opts: ["HTML", "CSS", "Python", "SQL"], correct: 0, cat: "💻 IT" },
        { q: "1 Gigabayt (GB) necha Megabayt (MB)?", opts: ["1024 MB", "1000 MB", "512 MB", "2048 MB"], correct: 0, cat: "💻 IT" },
        { q: "O'zbekiston Respublikasi poytaxti qaysi shahar?", opts: ["Toshkent", "Samarqand", "Buxoro", "Xiva"], correct: 0, cat: "🌍 Geografiya" },
        { q: "Dunyodagi eng katta okean qaysi?", opts: ["Tinch okeani", "Atlantika", "Hind okeani", "Shimoliy Muz"], correct: 0, cat: "🌍 Geografiya" },
        { q: "Amir Temur nechanchi yilda tug'ilgan?", opts: ["1336-yil", "1340-yil", "1300-yil", "1405-yil"], correct: 0, cat: "🏛️ Tarix" }
    ];

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    let questions = shuffleArray(rawQuestions);
    let currentIndex = 0;
    let score = parseInt(localStorage.getItem('sa_score') || '0');
    let hearts = parseInt(localStorage.getItem('sa_hearts') || '5');

    // TELEGRAM INIT
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            let tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser && tgUser.first_name) {
                document.getElementById('userName').innerText = tgUser.first_name;
            }
        }
    } catch(e) {}

    function updateUI() {
        document.getElementById('userScore').innerText = score + ' pt';
        document.getElementById('heartsDisplay').innerText = '❤️'.repeat(hearts) + '🖤'.repeat(5 - hearts);
        
        if (hearts <= 0) {
            document.getElementById('quizCard').style.display = 'none';
            document.getElementById('gameOverCard').style.display = 'flex';
        } else {
            document.getElementById('quizCard').style.display = 'flex';
            document.getElementById('gameOverCard').style.display = 'none';
        }
    }

    function loadQuestion() {
        if (hearts <= 0) return;
        let q = questions[currentIndex];
        document.getElementById('qCat').innerText = q.cat;
        document.getElementById('qText').innerText = q.q;

        let optionsWithIndex = q.opts.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
        optionsWithIndex = shuffleArray(optionsWithIndex);

        let html = '';
        optionsWithIndex.forEach((optObj) => {
            html += `<button type="button" class="btn" onclick="checkAnswer(${optObj.isCorrect})">${optObj.text}</button>`;
        });
        document.getElementById('answers').innerHTML = html;
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            score += 10;
            localStorage.setItem('sa_score', score);
            alert("To'g'ri! 🎉 +10 pt");
        } else {
            hearts--;
            localStorage.setItem('sa_hearts', hearts);
            alert("Noto'g'ri! ❌ 1 ta yurakcha yo'qoldi!");
        }

        updateUI();

        if (hearts > 0) {
            currentIndex = (currentIndex + 1) % questions.length;
            loadQuestion();
        }
    }

    function resetHearts() {
        hearts = 5;
        localStorage.setItem('sa_hearts', '5');
        updateUI();
        loadQuestion();
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'game') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('gameSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('leaderboardSection').classList.add('active');
            renderLeaderboard();
        }
    }

    function renderLeaderboard() {
        // Namuna sifatida static va joriy foydalanuvchi reytingi
        let currentUserName = document.getElementById('userName').innerText;
        let mockData = [
            { name: "Jasur_IT", score: 450 },
            { name: "Sardor_Dev", score: 380 },
            { name: "Madina_99", score: 310 },
            { name: currentUserName, score: score },
            { name: "Ali_Valiyev", score: 180 }
        ];

        // Ball bo'yicha saralash
        mockData.sort((a, b) => b.score - a.score);

        let html = '';
        mockData.forEach((item, index) => {
            let isMe = item.name === currentUserName;
            html += `
                <div class="leaderboard-item" style="${isMe ? 'border-color: #3b82f6; background: rgba(59, 130, 246, 0.1);' : ''}">
                    <span class="rank">#${index + 1}</span>
                    <span class="leader-name">${item.name} ${isMe ? '(Siz)' : ''}</span>
                    <span class="leader-score">${item.score} pt</span>
                </div>
            `;
        });
        document.getElementById('leaderboardList').innerHTML = html;
    }

    // ISHGA TUSHIRISH
    updateUI();
    loadQuestion();
</script>

</body>
</html>
