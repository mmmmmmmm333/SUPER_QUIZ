<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART AREA</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 0;
      width: 100%;
      display: block;
    }
    .btn-option {
      background: #334155;
    }
    .btn-option:active {
      background: #1d4ed8;
    }
    .leader-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }
    #scoreDisplay {
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* Sertifikat dizayni */
    .certificate {
      background: #f8fafc;
      color: #0f172a;
      border: 5px solid #f59e0b;
      border-radius: 15px;
      padding: 20px;
      margin-top: 15px;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .cert-title {
      font-size: 20px;
      font-weight: bold;
      color: #b45309;
    }
    .cert-name {
      font-size: 24px;
      font-weight: bold;
      color: #1d4ed8;
      margin: 10px 0;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h2>🎮 SMART AREA</h2>
  <div id="scoreDisplay">Jami ball: 0</div>

  <!-- Savol kartochkasi -->
  <div class="card" id="quizCard">
    <h3 id="questionText">Savol yuklanmoqda...</h3>
    <div id="optionsBox"></div>
  </div>

  <button class="btn" style="background: #10b981;" onclick="toggleLeaderboard()">🏆 Top 10 Reyting</button>
  <button class="btn" style="background: #f59e0b;" onclick="checkCertificate()">📜 Kun chempioni sertifikati</button>

  <!-- Reyting kartochkasi -->
  <div id="leaderCard" class="card" style="display: none;">
    <h3>Peshqadamlar</h3>
    <div id="leaderList">Yuklanmoqda...</div>
  </div>

  <!-- Sertifikat oynasi -->
  <div id="certCard" class="certificate">
    <div class="cert-title">🎖 KUN CHEMPIONI SERTIFIKATI 🎖</div>
    <p>Ushbu sertifikat SMART AREA o'yinida kunning eng yuqori natijasini ko'rsatgani uchun:</p>
    <div class="cert-name" id="certWinnerName">Foydalanuvchi</div>
    <p>ga tantanali ravishda topshiriladi!</p>
    <small id="certDate"></small>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const SUPABASE_URL = "https://hqjmcfaywfjwjqamyaik.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxam1jZmF5d2Zqd2pxYW15YWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDE3MDEsImV4cCI6MjEwMTc3NzcwMX0.WHzdySBpsjONCB1t3aEsIEh9CGr0uybye2qzg1Ovghw";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentQuestion = null;
    let totalScore = 0;

    // OpenTDB API orqali cheksiz tasodifiy savol yuklash
    async function fetchNewQuestion() {
      document.getElementById("questionText").innerText = "Yangi savol yuklanmoqda...";
      document.getElementById("optionsBox").innerHTML = "";

      try {
        const response = await fetch("https://opentdb.com/api.php?amount=1&type=multiple");
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
          const qData = data.results[0];
          
          // HTML belgilarini to'g'rilash (masalan &quot; -> ")
          const parser = new DOMParser();
          const decodedQuestion = parser.parseFromString(qData.question, 'text/html').body.textContent;
          
          // Variantlarni aralashtirish
          let options = [...qData.incorrect_answers];
          const correctIndex = Math.floor(Math.random() * 4);
          options.splice(correctIndex, 0, qData.correct_answer);

          currentQuestion = {
            question: decodedQuestion,
            options: options.map(opt => parser.parseFromString(opt, 'text/html').body.textContent),
            correctIndex: correctIndex
          };

          renderQuestion();
        }
      } catch (e) {
        document.getElementById("questionText").innerText = "Savol yuklashda xatolik! Qaytadan urinib ko'ring.";
      }
    }

    function renderQuestion() {
      document.getElementById("questionText").innerText = currentQuestion.question;
      const optionsBox = document.getElementById("optionsBox");
      optionsBox.innerHTML = "";

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn btn-option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        optionsBox.appendChild(btn);
      });
    }

    async function checkAnswer(selectedIndex) {
      if (selectedIndex === currentQuestion.correctIndex) {
        totalScore += 10;
        document.getElementById("scoreDisplay").innerText = `Jami ball: ${totalScore}`;
        await sendScoreToBackend(10);
      }
      fetchNewQuestion(); // Darhol keyingi cheksiz savolga o'tish
    }

    async function sendScoreToBackend(points) {
      try {
        if (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initDataUnsafe.user) return;
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;

        const { data } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .eq('user_id', tgUser.id.toString());

        if (data && data.length > 0) {
          await supabaseClient
            .from('leaderboard')
            .update({ 
              score: Number(data[0].score) + Number(points), 
              name: tgUser.first_name 
            })
            .eq('user_id', tgUser.id.toString());
        } else {
          await supabaseClient
            .from('leaderboard')
            .insert([{ 
              user_id: tgUser.id.toString(), 
              name: tgUser.first_name, 
              score: Number(points) 
            }]);
        }
      } catch (e) {
        console.error("Xato:", e);
      }
    }

    async function toggleLeaderboard() {
      const card = document.getElementById("leaderCard");
      if (card.style.display === "block") {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      document.getElementById("certCard").style.display = "none";
      
      const list = document.getElementById("leaderList");
      list.innerHTML = "Yuklanmoqda...";

      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (data && data.length > 0) {
          list.innerHTML = data.map((u, i) => `
            <div class="leader-item">
              <span>${i + 1}. ${u.name}</span>
              <b>${u.score} ball</b>
            </div>
          `).join("");
        } else {
          list.innerHTML = "Hali hech kim ball to'plamadi.";
        }
      } catch (e) {
        list.innerHTML = "Reytingni yuklab bo'lmadi.";
      }
    }

    // Kun oxirida eng yuqori ball to'plagan chempion sertifikatini ko'rsatish
    async function checkCertificate() {
      const certCard = document.getElementById("certCard");
      if (certCard.style.display === "block") {
        certCard.style.display = "none";
        return;
      }

      document.getElementById("leaderCard").style.display = "none";

      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(1);

        if (data && data.length > 0) {
          const winner = data[0];
          document.getElementById("certWinnerName").innerText = winner.name;
          document.getElementById("certDate").innerText = "Sana: " + new Date().toLocaleDateString();
          certCard.style.display = "block";
        } else {
          alert("Hali kun chempioni aniqlanmadi.");
        }
      } catch (e) {
        alert("Sertifikatni yuklab bo'lmadi.");
      }
    }

    // O'yinni boshlash
    fetchNewQuestion();
  </script>

</body>
</html>
