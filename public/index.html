<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #0b0f19; 
            color: #ffffff; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .app { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .header { 
            background: #151c2c; 
            padding: 14px 18px; 
            border-radius: 14px; 
            border: 1px solid #1e293b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
        }
        .score { 
            color: #f59e0b; 
            font-size: 17px; 
        }
        .bonus-card {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 1px solid #10b981;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bonus-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .card { 
            background: #151c2c; 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .q-counter {
            font-size: 12px;
            color: #3b82f6;
            font-weight: bold;
            text-transform: uppercase;
        }
        .question { 
            font-size: 16px; 
            font-weight: bold; 
            color: #f3f4f6; 
            line-height: 1.4;
        }
        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #3b82f6; 
            color: white; 
            padding: 14px; 
            width: 100%; 
            border-radius: 10px; 
            font-size: 14px; 
            cursor: pointer; 
            text-align: left;
            transition: 0.1s;
        }
        .btn:active { 
            background: #3b82f6; 
        }
        .info-box {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- HEADER: Fodalanuvchi va Ball -->
    <div class="header">
        <span id="userName">O'yinchi</span>
        <span class="score" id="userScore">0 pt</span>
    </div>

    <!-- KUNLIK BONUS -->
    <div class="bonus-card">
        <div>
            <div style="font-weight: bold; font-size: 13px;">🎁 Kunlik Bonus</div>
            <div style="font-size: 11px; color: #9ca3af;">Har kuni 50 ball oling</div>
        </div>
        <button type="button" class="bonus-btn" id="bonusBtn" onclick="claimDailyBonus()">Olish</button>
    </div>

    <!-- SAVOLLAR KARTASI -->
    <div class="card">
        <div class="q-counter" id="qCat">SMART ARENA TEST</div>
        <div class="question" id="qText">Savol yuklanmoqda...</div>
        <div id="answers" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div class="info-box">Har bir to'g'ri javob uchun <b>+10 pt</b> beriladi</div>
</div>

<script>
    // 40+ TA TASODIFIY SAVOLLAR BAZASI
    const rawQuestions = [
        // MATEMATIKA & MANTIQ
        { q: "15 x 4 nechiga teng?", opts: ["60", "50", "65", "55"], correct: 0, cat: "🧮 Matematika" },
        { q: "Kvadratning nechtasi teng tomoni bor?", opts: ["4 ta", "3 ta", "6 ta", "2 ta"], correct: 0, cat: "🧮 Matematika" },
        { q: "25 ning kvadrat ildizi nechaga teng?", opts: ["5", "6", "4", "10"], correct: 0, cat: "🧮 Matematika" },
        { q: "99 + 101 nechiga teng?", opts: ["200", "190", "201", "210"], correct: 0, cat: "🧮 Matematika" },
        { q: "100 ning 20% qismi necha bo'ladi?", opts: ["20", "10", "25", "50"], correct: 0, cat: "🧮 Matematika" },
        { q: "Eng kichik juft tub son qaysi?", opts: ["2", "0", "1", "4"], correct: 0, cat: "🧮 Mantiq" },
        { q: "30 ni 0.5 ga bo'lsangiz necha chiqadi?", opts: ["60", "15", "30", "45"], correct: 0, cat: "🧮 Mantiq" },

        // DASTURLASH & IT
        { q: "Pythonda konsolga matn chiqarish kodi qaysi?", opts: ["print()", "echo()", "console.log()", "System.out()"], correct: 0, cat: "💻 Dasturlash" },
        { q: "Veb-sahifa tuzilishini (skeletini) yarativchi til?", opts: ["HTML", "CSS", "Python", "SQL"], correct: 0, cat: "💻 IT" },
        { q: "1 Gigabayt (GB) necha Megabayt (MB)?", opts: ["1024 MB", "1000 MB", "512 MB", "2048 MB"], correct: 0, cat: "💻 IT" },
        { q: "Telegram ilovasi asoschisi kim?", opts: ["Pavel Durov", "Mark Zuckerberg", "Bill Gates", "Elon Musk"], correct: 0, cat: "💻 IT" },
        { q: "CSS nima uchun ishlatiladi?", opts: ["Dizayn va stil berish", "Ma'lumotlar bazasi", "Server kodi", "Algoritm"], correct: 0, cat: "💻 Dasturlash" },
        { q: "Ma'lumotlar bazasi bilan ishlash tili qaysi?", opts: ["SQL", "HTML", "C++", "Java"], correct: 0, cat: "💻 IT" },

        // GEOGRAFIYA & UMUMIY BILIM
        { q: "O'zbekiston Respublikasi poytaxti qaysi shahar?", opts: ["Toshkent", "Samarqand", "Buxoro", "Xiva"], correct: 0, cat: "🌍 Geografiya" },
        { q: "Dunyodagi eng katta okean qaysi?", opts: ["Tinch okeani", "Atlantika", "Hind okeani", "Shimoliy Muz"], correct: 0, cat: "🌍 Geografiya" },
        { q: "O'zbekiston qachon mustaqillikka erishgan?", opts: ["1991-yil", "1990-yil", "1992-yil", "1989-yil"], correct: 0, cat: "🏛️ Tarix" },
        { q: "Amir Temur nechanchi yilda tug'ilgan?", opts: ["1336-yil", "1340-yil", "1300-yil", "1405-yil"], correct: 0, cat: "🏛️ Tarix" },
        { q: "Quyosh tizimidagi eng katta planeta qaysi?", opts: ["Yupiter", "Mars", "Saturn", "Yer"], correct: 0, cat: "🚀 Koinot" },
        { q: "Inson tanasidagi eng katta a'zo qaysi?", opts: ["Teri", "Jigar", "Yurak", "Miya"], correct: 0, cat: "🧬 Biologiya" },
        { q: "Suvning kimyoviy formulasi qanday?", opts: ["H2O", "CO2", "NaCl", "O2"], correct: 0, cat: "🧪 Kimyo" },

        // INGLIZ TILI & QIZIQARLI
        { q: "Ingliz tilida 'Apple' so'zining ma'nosi nima?", opts: ["Olma", "Nok", "Uzum", "Banan"], correct: 0, cat: "🇬🇧 Ingliz tili" },
        { q: "Ingliz tilida 'Book' nimani anglatadi?", opts: ["Kitob", "Daftar", "Rasm", "Qalam"], correct: 0, cat: "🇬🇧 Ingliz tili" },
        { q: "Futbol o'yinida bitta jamoada nechta o'yinchi bo'ladi?", opts: ["11 ta", "10 ta", "12 ta", "9 ta"], correct: 0, cat: "⚽ Sport" },
        { q: "Shaxmat taxtasida nechta katak bor?", opts: ["64 ta", "100 ta", "50 ta", "81 ta"], correct: 0, cat: "♟️ Mantiq" },
        { q: "Bir yilda necha fasl bor?", opts: ["4 ta", "12 ta", "7 ta", "2 ta"], correct: 0, cat: "🌍 Umumiy" },
        { q: "Dunyo xaritasida nechta qit'a bor?", opts: ["6 ta", "5 ta", "7 ta", "8 ta"], correct: 0, cat: "🌍 Geografiya" }
    ];

    // SAVOLLARNI TASODIFIY (SHUFFLE) QILISH FUNKSIYASI
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    let questions = shuffleArray(rawQuestions);
    let currentIndex = 0;
    let score = parseInt(localStorage.getItem('smart_arena_score') || '0');

    // TELEGRAM WE BAPP SOZLAMASI
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            let tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser && tgUser.first_name) {
                document.getElementById('userName').innerText = tgUser.first_name;
            }
        }
    } catch(e) {}

    // SCORE EKRANGA CHIQARISH
    document.getElementById('userScore').innerText = score + ' pt';

    // SAVOLNI YUKLASH
    function loadQuestion() {
        let q = questions[currentIndex];
        document.getElementById('qCat').innerText = q.cat + ` (${currentIndex + 1}/${questions.length})`;
        document.getElementById('qText').innerText = q.q;

        // Variantlarni ham aralashtiramiz
        let optionsWithIndex = q.opts.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
        optionsWithIndex = shuffleArray(optionsWithIndex);

        let html = '';
        optionsWithIndex.forEach((optObj) => {
            html += `<button type="button" class="btn" onclick="checkAnswer(${optObj.isCorrect})">${optObj.text}</button>`;
        });
        document.getElementById('answers').innerHTML = html;
    }

    // JAVOBNI TEKSHIRISH
    function checkAnswer(isCorrect) {
        if (isCorrect) {
            score += 10;
            localStorage.setItem('smart_arena_score', score);
            document.getElementById('userScore').innerText = score + ' pt';
            alert("To'g'ri! 🎉 +10 pt");
        } else {
            alert("Noto'g'ri! ❌");
        }

        currentIndex++;
        // Agar barcha savollar tugasa, yana qayta aralashtirib boshlaydi
        if (currentIndex >= questions.length) {
            questions = shuffleArray(rawQuestions);
            currentIndex = 0;
            alert("🔥 Barcha savollar topshirildi! Savollar qayta aralashtirildi.");
        }
        loadQuestion();
    }

    // KUNLIK BONUS
    function claimDailyBonus() {
        let lastBonus = localStorage.getItem('last_bonus_date');
        let today = new Date().toDateString();

        if (lastBonus === today) {
            alert("Siz bugungi bonusni olib bo'lgansiz! Ertaga qayta kiring. ⏳");
        } else {
            score += 50;
            localStorage.setItem('smart_arena_score', score);
            localStorage.setItem('last_bonus_date', today);
            document.getElementById('userScore').innerText = score + ' pt';
            alert("🎁 Tabriklaymiz! +50 pt bonus berildi!");
            document.getElementById('bonusBtn').innerText = "Olindi";
            document.getElementById('bonusBtn').style.opacity = "0.5";
        }
    }

    // ILK BOR YUKLASH
    loadQuestion();
</script>

</body>
</html>
