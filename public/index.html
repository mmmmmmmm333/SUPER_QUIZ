<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #0b0f19; 
            color: #ffffff; 
            padding: 20px 15px; 
            display: flex; 
            justify-content: center; 
        }
        .app { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .header { 
            background: #151c2c; 
            padding: 15px 20px; 
            border-radius: 14px; 
            border: 1px solid #1e293b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
        }
        .score { 
            color: #f59e0b; 
            font-size: 18px; 
        }
        .card { 
            background: #151c2c; 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .question { 
            font-size: 17px; 
            font-weight: bold; 
            color: #f3f4f6; 
            text-align: center; 
            line-height: 1.4;
        }
        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #3b82f6; 
            color: white; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            font-size: 15px; 
            cursor: pointer; 
            text-align: center;
        }
        .btn:active { 
            background: #3b82f6; 
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <span id="userName">O'yinchi</span>
        <span class="score" id="userScore">0 pt</span>
    </div>

    <div class="card">
        <div class="question" id="qText">Savol yuklanmoqda...</div>
        <div id="answers" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
</div>

<script>
    let score = 0;
    let currentIndex = 0;

    // Qaytariladigan oddiy savollar ro'yxati
    const questions = [
        { q: "5 + 5 nechiga teng?", opts: ["10", "12", "8"], correct: 0 },
        { q: "O'zbekiston poytaxti qaysi shahar?", opts: ["Samarqand", "Toshkent", "Buxoro"], correct: 1 },
        { q: "2 x 8 nechiga teng?", opts: ["14", "18", "16"], correct: 2 },
        { q: "Pythonda konsolga chiqarish buyrug'i qaysi?", opts: ["print()", "echo()", "console.log()"], correct: 0 }
    ];

    // Telegram sozlamalari
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            let tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser && tgUser.first_name) {
                document.getElementById('userName').innerText = tgUser.first_name;
            }
        }
    } catch(e) {}

    function loadQuestion() {
        let q = questions[currentIndex];
        document.getElementById('qText').innerText = q.q;
        let html = '';
        q.opts.forEach((opt, idx) => {
            html += `<button type="button" class="btn" onclick="checkAnswer(${idx})">${opt}</button>`;
        });
        document.getElementById('answers').innerHTML = html;
    }

    function checkAnswer(idx) {
        let q = questions[currentIndex];
        if (idx === q.correct) {
            score += 10;
            document.getElementById('userScore').innerText = score + ' pt';
            alert("To'g'ri! 🎉 +10 pt");
        } else {
            alert("Noto'g'ri! ❌");
        }

        // Keyingi savolga o'tish (oxiriga etgach, yana boshiga qaytadi)
        currentIndex = (currentIndex + 1) % questions.length;
        loadQuestion();
    }

    // Dasturni ishga tushirish
    loadQuestion();
</script>

</body>
</html>
