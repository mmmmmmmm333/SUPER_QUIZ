<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #151c2c; --accent-blue: #3b82f6; --text-main: #fff; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; text-align: center; border: 1px solid #334155; }
        button { background: var(--accent-blue); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h1>SMART ARENA</h1>
        <p>Hammasi ishlamoqda!</p>
    </div>

    <!-- O'yinlar -->
    <div class="card" onclick="openGame('Matematika')">
        <h3>🧮 Matematika testi</h3>
        <button>O'ynash</button>
    </div>

    <div class="card" onclick="openGame('Charxpalak')">
        <h3>🎡 Omad Charxpalagi</h3>
        <button>Aylantirish</button>
    </div>

    <script>
        // Telegramni ishga tushirish
        window.Telegram?.WebApp?.ready();

        // Xatolarni ushlash uchun funksiya
        function openGame(name) {
            try {
                alert(name + " o'yini ochilmoqda...");
                // Shu yerga o'yin logikasini qo'shasiz
            } catch(e) {
                alert("Xato: " + e.message);
            }
        }
    </script>
</body>
</html>
