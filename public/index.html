<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background: #0b0f19; 
            color: #ffffff; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        .app { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .header { 
            background: #151c2c; 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid #1e293b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .user-info { display: flex; flex-direction: column; gap: 2px; }
        .user-name { font-weight: bold; font-size: 15px; }
        .hearts { color: #ef4444; font-size: 14px; letter-spacing: 2px; }
        .score { color: #f59e0b; font-weight: bold; font-size: 16px; }

        .card { 
            background: #151c2c; 
            padding: 18px; 
            border-radius: 16px; 
            border: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .q-counter { font-size: 12px; color: #3b82f6; font-weight: bold; }
        .question { font-size: 16px; font-weight: bold; color: #f3f4f6; line-height: 1.4; }
        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid #3b82f6; 
            color: white; 
            padding: 14px; 
            width: 100%; 
            border-radius: 10px; 
            font-size: 14px; 
            cursor: pointer; 
            text-align: left;
        }
        .btn:active { background: #3b82f6; }

        .loader {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="user-info">
            <span class="user-name" id="userName">O'yinchi</span>
            <span class="hearts" id="heartsDisplay">❤️❤️❤️❤️❤️</span>
        </div>
        <span class="score" id="userScore">0 pt</span>
    </div>

    <!-- MAIN GAME CARD -->
    <div class="card" id="quizCard">
        <div class="q-counter" id="qCat">🌐 OPENTDB API (ONLINE BAZA)</div>
        <div class="question" id="qText">Savol yuklanmoqda... ⏳</div>
        <div id="answers" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="loader">Yangi savol olinmoqda...</div>
        </div>
    </div>

    <!-- GAME OVER CARD -->
    <div class="card" id="gameOverCard" style="display: none; text-align: center;">
        <h3 style="color: #ef4444; font-size: 20px;">💔 Yurakchalar tugadi!</h3>
        <p style="font-size: 13px; color: #9ca3af; margin: 10px 0;">O'yinni davom ettirish uchun imkoniyatlarni tiklang.</p>
        <button class="btn" style="text-align: center; background: #10b981;" onclick="resetHearts()">🔄 Qayta tiklash</button>
    </div>
</div>

<script>
    let score = parseInt(localStorage.getItem('sa_score') || '0');
    let hearts = parseInt(localStorage.getItem('sa_hearts') || '5');
    let currentCorrectAnswer = "";

    // TELEGRAM INIT
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            let tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser && tgUser.first_name) {
                document.getElementById('userName').innerText = tgUser.first_name;
            }
        }
    } catch(e) {}

    function updateUI() {
        document.getElementById('userScore').innerText = score + ' pt';
        document.getElementById('heartsDisplay').innerText = '❤️'.repeat(hearts) + '🖤'.repeat(5 - hearts);
        
        if (hearts <= 0) {
            document.getElementById('quizCard').style.display = 'none';
            document.getElementById('gameOverCard').style.display = 'flex';
        } else {
            document.getElementById('quizCard').style.display = 'flex';
            document.getElementById('gameOverCard').style.display = 'none';
        }
    }

    // BEPUL AVTO-TARJIMA FUNKSIYASI (MyMemory API)
    async function translateToUzbek(text) {
        try {
            // HTML belgilarni tozalash
            let cleanText = text.replace(/&quot;/g, '"').replace(/&#039;/g, "'").replace(/&amp;/g, "&");
            let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|uz`);
            let data = await res.json();
            return data.responseData.translatedText || cleanText;
        } catch(e) {
            return text;
        }
    }

    // OPENTDB DAN SAVOL YUKLASH
    async function fetchQuestionFromOpenTDB() {
        if (hearts <= 0) return;

        document.getElementById('qText').innerText = "Yangi savol tarjima qilinmoqda... ⏳";
        document.getElementById('answers').innerHTML = '<div class="loader">Yuklanmoqda...</div>';

        try {
            // OpenTDB API: Multiple Choice (4 ta variantli) savol olish
            let response = await fetch('https://opentdb.com/api.php?amount=1&type=multiple');
            let data = await response.json();
            
            if (data.results && data.results.length > 0) {
                let qData = data.results[0];
                
                // Savol va variantlarni tarjima qilish
                let translatedQuestion = await translateToUzbek(qData.question);
                let translatedCategory = await translateToUzbek(qData.category);

                let allAnswers = [...qData.incorrect_answers, qData.correct_answer];
                // Variantlarni aralashtiramiz
                allAnswers.sort(() => Math.random() - 0.5);

                // Variantlarni ham tarjima qilamiz
                let translatedAnswers = await Promise.all(allAnswers.map(ans => translateToUzbek(ans)));
                let translatedCorrect = await translateToUzbek(qData.correct_answer);

                currentCorrectAnswer = translatedCorrect;

                // Ekranga chiqarish
                document.getElementById('qCat').innerText = "🌐 " + translatedCategory.toUpperCase();
                document.getElementById('qText').innerText = translatedQuestion;

                let html = '';
                translatedAnswers.forEach(ans => {
                    html += `<button type="button" class="btn" onclick="checkAnswer('${ans.replace(/'/g, "\\'")}')">${ans}</button>`;
                });
                document.getElementById('answers').innerHTML = html;
            }
        } catch (error) {
            document.getElementById('qText').innerText = "Xatolik yuz berdi. Qayta urinib ko'rilmoqda...";
            setTimeout(fetchQuestionFromOpenTDB, 2000);
        }
    }

    function checkAnswer(selectedAns) {
        if (selectedAns === currentCorrectAnswer) {
            score += 10;
            localStorage.setItem('sa_score', score);
            alert("To'g'ri! 🎉 +10 pt");
        } else {
            hearts--;
            localStorage.setItem('sa_hearts', hearts);
            alert(`Noto'g'ri! ❌ To'g'ri javob: ${currentCorrectAnswer}`);
        }

        updateUI();

        if (hearts > 0) {
            fetchQuestionFromOpenTDB();
        }
    }

    function resetHearts() {
        hearts = 5;
        localStorage.setItem('sa_hearts', '5');
        updateUI();
        fetchQuestionFromOpenTDB();
    }

    // ILK BOR ISHGA TUSHIRISH
    updateUI();
    fetchQuestionFromOpenTDB();
</script>

</body>
</html>
