<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART AREA</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px 0;
      width: 100%;
      display: block;
    }
    .btn-option {
      background: #334155;
    }
    .btn-option:active {
      background: #1d4ed8;
    }
    .leader-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }
    #scoreDisplay {
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🎮 SMART AREA</h2>
  <div id="scoreDisplay">Jami ball: 0</div>

  <!-- Savol kartochkasi -->
  <div class="card" id="quizCard">
    <h3 id="questionText">Savol yuklanmoqda...</h3>
    <div id="optionsBox"></div>
  </div>

  <button class="btn" style="background: #10b981;" onclick="toggleLeaderboard()">🏆 Top 10 Reyting</button>

  <!-- Reyting kartochkasi -->
  <div id="leaderCard" class="card" style="display: none;">
    <h3>Peshqadamlar</h3>
    <div id="leaderList">Yuklanmoqda...</div>
  </div>

  <script>
    // Telegram WebApp sozlanishi
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Supabase sozlamalari
    const SUPABASE_URL = "https://hqjmcfaywfjwjqamyaik.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxam1jZmF5d2Zqd2pxYW15YWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDE3MDEsImV4cCI6MjEwMTc3NzcwMX0.WHzdySBpsjONCB1t3aEsIEh9CGr0uybye2qzg1Ovghw";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Savollar ro'yxati (aylanib takrorlanaveradi)
    const quizData = [
      { q: "O'zbekiston poytaxti qaysi shahar?", options: ["Toshkent", "Samarqand", "Buxoro", "Xiva"], correct: 0 },
      { q: "2 + 2 * 2 nechaga teng?", options: ["8", "6", "4", "10"], correct: 1 },
      { q: "Quyosh qaysi tomondan chiqadi?", options: ["G'arb", "Janub", "Sharq", "Shimol"], correct: 2 },
      { q: "Eng katta okean qaysi?", options: ["Atlantika", "Hind", "Tinch", "Shtil"], correct: 2 }
    ];

    let currentQuestionIndex = 0;
    let totalScore = 0;

    // Savolni ekranga chiqarish
    function loadQuestion() {
      const q = quizData[currentQuestionIndex];
      document.getElementById("questionText").innerText = q.q;
      
      const optionsBox = document.getElementById("optionsBox");
      optionsBox.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn btn-option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        optionsBox.appendChild(btn);
      });
    }

    // Javobni tekshirish va keyingi savolga o'tish
    async function checkAnswer(selectedIndex) {
      const q = quizData[currentQuestionIndex];
      if (selectedIndex === q.correct) {
        totalScore += 10;
        document.getElementById("scoreDisplay").innerText = `Jami ball: ${totalScore}`;
        await sendScoreToBackend(10); // 10 ballni Supabase'ga yuborish
      }

      // Keyingi savolga o'tish (cheksiz takrorlanish)
      currentQuestionIndex = (currentQuestionIndex + 1) % quizData.length;
      loadQuestion();
    }

    // Ballni Supabase bazasiga saqlash
    async function sendScoreToBackend(points) {
      try {
        if (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initDataUnsafe.user) {
          return;
        }
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;

        const { data } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .eq('user_id', tgUser.id.toString());

        if (data && data.length > 0) {
          await supabaseClient
            .from('leaderboard')
            .update({ 
              score: Number(data[0].score) + Number(points), 
              name: tgUser.first_name 
            })
            .eq('user_id', tgUser.id.toString());
        } else {
          await supabaseClient
            .from('leaderboard')
            .insert([{ 
              user_id: tgUser.id.toString(), 
              name: tgUser.first_name, 
              score: Number(points) 
            }]);
        }
      } catch (e) {
        console.error("Xato:", e);
      }
    }

    // Reytingni ko'rsatish/yashirish
    async function toggleLeaderboard() {
      const card = document.getElementById("leaderCard");
      if (card.style.display === "block") {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      
      const list = document.getElementById("leaderList");
      list.innerHTML = "Yuklanmoqda...";

      try {
        const { data, error } = await supabaseClient
          .from('leaderboard')
          .select('*')
          .order('score', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (data && data.length > 0) {
          list.innerHTML = data.map((u, i) => `
            <div class="leader-item">
              <span>${i + 1}. ${u.name}</span>
              <b>${u.score} ball</b>
            </div>
          `).join("");
        } else {
          list.innerHTML = "Hali hech kim ball to'plamadi.";
        }
      } catch (e) {
        console.error("Reyting xatosi:", e);
        list.innerHTML = "Reytingni yuklab bo'lmadi.";
      }
    }

    // Ilovani ishga tushirish
    loadQuestion();
  </script>

</body>
</html>
