<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMART ARENA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; padding: 20px; }
        .btn { 
            background: #3b82f6; 
            padding: 20px; 
            margin: 10px 0; 
            border-radius: 10px; 
            text-align: center; 
            cursor: pointer;
            border: none;
            color: white;
            width: 100%;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Smart Arena</h1>
    <!-- Agar bu tugmalar ishlamasa, demak kod umuman yuklanmayapti -->
    <button class="btn" onclick="alert('JavaScript ishlayapti!')">1. TEST TUGMASI</button>
    <button class="btn" onclick="openGame()">2. O'YINNI OCHISH</button>

    <div id="game-area" style="display:none; padding:20px; border: 1px solid white;">
        O'yin boshlandi!
    </div>

    <script>
        // Telegram WebApp sozlamasi
        try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        } catch(e) {}

        function openGame() {
            document.getElementById('game-area').style.display = 'block';
            alert('O\'yin ochildi!');
        }
    </script>
</body>
</html>
